name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use project npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and DOM tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        id: browsers
        run: npm run test:e2e -- --reporter=line,html --global-timeout=600000
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser failure evidence
        if: ${{ failure() && steps.browsers.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
